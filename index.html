<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polytrack Codes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <a class="brand" href="#/"><h1>Polytrack Codes</h1></a>
    <p class="lede">Share tracks and publish a release for each game version. Every release is marked stable or dev, so nobody imports a code into the wrong build.</p>
    <p class="banner" id="banner" role="status" hidden></p>
    <form class="auth" id="auth-form" hidden novalidate>
      <p class="auth-title">Sign in to create tracks and comment <span class="hint">(browsing and copying need no account)</span></p>
      <div class="auth-row">
        <input type="text" id="auth-name" maxlength="40" autocomplete="nickname" placeholder="Display name" aria-label="Display name" hidden>
        <input type="email" id="auth-email" autocomplete="email" placeholder="you@example.com" aria-label="Email address">
        <input type="password" id="auth-pass" autocomplete="current-password" placeholder="Password" aria-label="Password">
        <button class="btn" type="submit" id="auth-submit">Sign in</button>
      </div>
      <p class="hint"><button type="button" class="linkbtn" id="auth-mode">New here? Create an account</button></p>
      <p class="hint" id="auth-msg" role="status"></p>
    </form>
    <p class="auth-who" id="auth-who" hidden><span id="auth-label"></span> <button type="button" class="linkbtn" id="auth-out">Sign out</button></p>
  </header>

  <main class="view" id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="api.js"></script>
<script>
/* Back the page with Supabase unless something (a test) already provided window.polytrack. */
try { if (window.PolytrackApi) PolytrackApi.install(window); } catch (e) { window.__backendError = 'Could not start the backend.'; }
</script>
<script src="app.js"></script>
</body>
</html>
